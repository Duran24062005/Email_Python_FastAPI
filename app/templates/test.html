<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Document</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050505;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.14);
            --text: #f5f1e8;
            --muted: #b7aa92;
            --accent: #d8b36a;
            --accent-soft: rgba(216, 179, 106, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, rgba(216, 179, 106, 0.12), transparent 32%),
                linear-gradient(180deg, #111111 0%, var(--bg) 55%, #000000 100%);
            color: var(--text);
        }

        .wrapper {
            width: min(720px, 100%);
            padding: 40px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.4rem);
            line-height: 1.05;
            font-weight: 600;
        }

        .subtitle {
            margin: 18px 0 32px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 58ch;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 14px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 20px;
            color: var(--text);
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        a:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .link-label {
            font-size: 1.1rem;
        }

        .link-arrow {
            color: var(--accent);
            font-size: 1.4rem;
        }

        @media (max-width: 640px) {
            .wrapper {
                padding: 28px 22px;
            }

            a {
                padding: 16px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <p class="eyebrow">Template Lab</p>
        <h1>Test document for templates</h1>
        <p class="subtitle">
            A simple preview hub for the available email templates. Choose one of the
            views below to open and inspect the rendered design.
        </p>
        <ul>
            <li>
                <a href="./login_educonnect.html">
                    <span class="link-label">Login Educonnect</span>
                    <span class="link-arrow">↗</span>
                </a>
            </li>
            <li>
                <a href="./welcome_active_count_educonnect.html">
                    <span class="link-label">Welcome Active Count</span>
                    <span class="link-arrow">↗</span>
                </a>
            </li>
            <li>
                <a href="./welcome_inactive_count_educonnect.html">
                    <span class="link-label">Welcome Inactive Count</span>
                    <span class="link-arrow">↗</span>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
