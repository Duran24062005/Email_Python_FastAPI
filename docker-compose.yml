services:
  email-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-python-fastapi
    env_file:
      - .env
    ports:
      - "${PORT:-8001}:8001"
    environment:
      PORT: 8001
      HOST: 0.0.0.0
      DOMAIN: ${DOMAIN:-http://localhost:8001/}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://swift-mailer.vercel.app}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-admin}
      PGPASSWORD: ${PGPASSWORD:-admin123}
      PGDATABASE: ${PGDATABASE:-email_db}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/templates:/app/app/templates
      - ./app/static:/app/app/static
      - ./app/uploads:/app/app/uploads
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8001
      --reload
      --reload-dir /app/app
    networks:
      - email-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: email-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PGUSER:-admin}
      POSTGRES_PASSWORD: ${PGPASSWORD:-admin123}
      POSTGRES_DB: ${PGDATABASE:-email_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - email-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-admin} -d ${PGDATABASE:-email_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  email-network:
    driver: bridge

volumes:
  postgres-data:
